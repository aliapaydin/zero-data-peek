name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild ZeroDataPeek.sln /t:Restore /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Build
        run: >
          msbuild ZeroDataPeek.sln
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=false
          /m /nologo /v:minimal


      - name: DuckDB yerel kitaplığı çıktıda mı
        shell: pwsh
        run: |
          $dll = Get-ChildItem src/ZeroDataPeek/bin -Recurse -Filter duckdb.dll | Select-Object -First 1
          if (-not $dll) { throw "duckdb.dll uygulama çıktısında yok (${{ matrix.platform }})" }
          "{0} ({1:N1} MB)" -f $dll.FullName, ($dll.Length / 1MB)

      - name: Kod düzenleyici dosyaları çıktıda mı
        shell: pwsh
        run: |
          $page = Get-ChildItem src/ZeroDataPeek/bin -Recurse -Filter editor.html | Where-Object { $_.FullName -match 'Assets\\monaco' } | Select-Object -First 1
          if (-not $page) { throw "Assets/monaco/editor.html uygulama çıktısında yok (${{ matrix.platform }})" }
          $main = Join-Path $page.DirectoryName 'vs/editor/editor.main.js'
          if (-not (Test-Path $main)) { throw "Monaco dosyaları eksik: $main" }
          $page.FullName

      - name: Belge düzenleyici ve sağ tık eklentisi çıktıda mı
        shell: pwsh
        run: |
          $doc = Get-ChildItem src/ZeroDataPeek/bin -Recurse -Filter docx.js | Where-Object { $_.FullName -match 'Assets\\docedit' } | Select-Object -First 1
          if (-not $doc) { throw "Assets/docedit/docx.js uygulama çıktısında yok (${{ matrix.platform }})" }
          $dll = Get-ChildItem src/ZeroDataPeek/bin -Recurse -Filter ZdpShell.dll | Select-Object -First 1
          if (-not $dll) { throw "ZdpShell.dll uygulama çıktısında yok (${{ matrix.platform }})" }
          $doc.FullName
          $dll.FullName

  strings:
    # Arayüzdeki her Türkçe metnin Strings/en.json içinde karşılığı var mı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-strings.py
