name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild ZeroDataPeek.sln /t:Restore /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Build
        run: >
          msbuild ZeroDataPeek.sln
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=false
          /m /nologo /v:minimal


      - name: DuckDB yerel kitaplığı çıktıda mı
        shell: pwsh
        run: |
          $dll = Get-ChildItem src/ZeroDataPeek/bin -Recurse -Filter duckdb.dll | Select-Object -First 1
          if (-not $dll) { throw "duckdb.dll uygulama çıktısında yok (${{ matrix.platform }})" }
          "{0} ({1:N1} MB)" -f $dll.FullName, ($dll.Length / 1MB)

  strings:
    # Arayüzdeki her Türkçe metnin Strings/en.json içinde karşılığı var mı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-strings.py
