name: store-package

# Microsoft Store'a yüklenecek .msixupload paketini üretir (x64 + ARM64 tek pakette).
# Elle çalıştır: Actions → store-package → Run workflow. "v*" etiketi gönderilince de çalışır.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Store paketi
        shell: pwsh
        run: >
          msbuild src/ZeroDataPeek/ZeroDataPeek.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxBundle=Always
          "/p:AppxBundlePlatforms=x64|ARM64"
          /p:AppxPackageDir=$env:GITHUB_WORKSPACE\packages\
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /m /nologo /v:minimal

      - name: Üretilen dosyalar
        shell: pwsh
        run: Get-ChildItem packages -Recurse -Include *.msixupload, *.msixbundle | Select-Object FullName, Length

      # Paket boyutunu izlemek için: x64 paketinin içindeki en büyük dosyalar.
      - name: Paket içeriği
        shell: pwsh
        run: |
          $upload = Get-ChildItem packages -Recurse -Filter *.msixupload | Select-Object -First 1
          Copy-Item $upload.FullName upload.zip
          Expand-Archive upload.zip -DestinationPath upload
          Get-ChildItem upload | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          $bundle = Get-ChildItem upload -Filter *.msixbundle | Select-Object -First 1
          Copy-Item $bundle.FullName bundle.zip
          Expand-Archive bundle.zip -DestinationPath bundle
          Get-ChildItem bundle | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          $x64 = Get-ChildItem bundle -Filter *x64*.msix | Select-Object -First 1
          Copy-Item $x64.FullName x64.zip
          Expand-Archive x64.zip -DestinationPath x64
          Get-ChildItem x64 -Recurse -File | Sort-Object Length -Descending | Select-Object -First 30 @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, @{n='Path';e={$_.FullName.Substring((Resolve-Path x64).Path.Length + 1)}} | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroDataPeek-StoreUpload
          path: packages/**/*.msixupload
          if-no-files-found: error
